<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення таксі Кобеляки</title>
    <!-- Підключаємо Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS для карти -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: 42vh;
            flex-shrink: 0;
        }
        .form-container {
            flex-grow: 1;
            background: var(--tg-theme-bg-color, #fff);
            padding: 12px 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #666);
        }
        input, select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: var(--tg-theme-secondary-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .row {
            display: flex;
            gap: 8px;
        }
        .row input {
            flex-grow: 1;
        }
        button.action-btn {
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
            margin-bottom: 5px;
        }
        .submit-btn:active {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="form-container">
        <div class="input-group">
            <label>📞 Ваш номер телефону</label>
            <input type="tel" id="phone" placeholder="+380XXXXXXXXX" value="380">
        </div>

        <div class="input-group">
            <label>📍 Звідки забирати?</label>
            <div class="row">
                <input type="text" id="address_from" placeholder="Вулиця, номер будинку">
                <button class="action-btn" onclick="setMarkerFrom()">Ар. Звідки</button>
            </div>
        </div>

        <div class="input-group">
            <label>🏁 Куди їдемо?</label>
            <div class="row">
                <input type="text" id="address_to" placeholder="Вулиця призначення">
                <button class="action-btn" onclick="setMarkerTo()">Ар. Куди</button>
            </div>
        </div>

        <div class="row">
            <div class="input-group" style="flex: 1;">
                <label>💳 Оплата</label>
                <select id="payment_method">
                    <option value="Готівка">Готівка</option>
                    <option value="Картка">Картка</option>
                </select>
            </div>
            <div class="input-group" style="flex: 1;">
                <label>💰 Ціна (грн)</label>
                <input type="number" id="price" value="100">
            </div>
        </div>

        <button class="submit-btn" onclick="submitOrder()">Підтвердити замовлення</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Ініціалізація карти Кобеляки
        let map = L.map('map').setView([49.1435, 34.2045], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker([49.1435, 34.2045], {draggable: true}).addTo(map);

        // Оновлення координат при перетягуванні маркера
        marker.on('dragend', function(e) {
            let pos = marker.getLatLng();
            getAddress(pos.lat, pos.lng, 'address_to');
        });

        // Також робимо клік по карті зручним: клік пересуває маркер у те місце
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            getAddress(e.latlng.lat, e.latlng.lng, 'address_to');
        });

        function getAddress(lat, lon, elementId) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                headers: { 'Accept-Language': 'uk' }
            })
            .then(response => response.json())
            .then(data => {
                if (data && data.display_name) {
                    let parts = data.display_name.split(',');
                    let shortName = parts.slice(0, 3).join(',');
                    document.getElementById(elementId).value = shortName;
                }
            }).catch(err => console.log(err));
        }

        function setMarkerFrom() {
            let center = map.getCenter();
            marker.setLatLng(center);
            getAddress(center.lat, center.lng, 'address_from');
        }

        function setMarkerTo() {
            let center = map.getCenter();
            marker.setLatLng(center);
            getAddress(center.lat, center.lng, 'address_to');
        }

        function submitOrder() {
            let phone = document.getElementById('phone').value.trim();
            let address_from = document.getElementById('address_from').value.trim();
            let address_to = document.getElementById('address_to'].value.trim() || "Центр, Кобеляки";
            let payment_method = document.getElementById('payment_method').value;
            let price = document.getElementById('price').value;

            if (!phone || phone.length < 9) {
                alert("Будь ласка, введіть номер телефону!");
                return;
            }

            let orderData = {
                phone: phone,
                address_from: address_from || "Центр",
                address_to: address_to,
                payment_method: payment_method,
                price: price,
                price_desc: "(тариф Кобеляки)"
            };

            // Передаємо дані у бота і закриваємо WebApp
            tg.sendData(JSON.stringify(orderData));
            tg.close();
        }
    </script>
</body>
</html>
