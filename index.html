<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вибір маршруту на мапі</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Підключаємо Leaflet CSS та JS для інтерактивної карти -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; background: #f4f4f4; overflow: hidden; }
        #map-container { width: 100%; height: 45vh; position: relative; }
        #map { width: 100%; height: 100%; }
        .map-pin { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); font-size: 32px; pointer-events: none; z-index: 1000; }
        .panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 55vh; background: #fff; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); overflow-y: auto; }
        .input-group { margin-bottom: 6px; }
        label { font-size: 11px; font-weight: bold; color: #444; display: block; margin-bottom: 2px; }
        input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; background: #fff; }
        .quick-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        .q-btn { background: #e1ecf4; color: #0366d6; border: none; padding: 5px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .btn-group { display: flex; gap: 8px; margin-top: 6px; }
        button { border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        #submitBtn { background: #2ea44f; color: white; }
        #cancelBtn { background: #d73a49; color: white; }
        .hint { font-size: 11px; color: #0366d6; text-align: center; margin-bottom: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map-container">
        <div class="map-pin">📍</div>
        <div id="map"></div>
    </div>

    <div class="panel">
        <div>
            <div class="hint">🗺 Рухайте мапу, щоб поставити мітку на місці посадки</div>
            
            <div class="quick-buttons">
                <button class="q-btn" onclick="setPreset('Автостанція', 49.1460, 34.1850)">Автостанція</button>
                <button class="q-btn" onclick="setPreset('Лікарня', 49.1410, 34.2000)">Лікарня</button>
                <button class="q-btn" onclick="setPreset('Ринок', 49.1450, 34.1910)">Ринок</button>
                <button class="q-btn" onclick="setPreset('Вокзал', 49.1320, 34.1780)">Вокзал</button>
            </div>

            <div class="input-group">
                <label>📍 Звідки забирати:</label>
                <input type="text" id="from_address" value="Центр (Кобеляки)" placeholder="Адреса або точка з мапи">
            </div>
            
            <div class="input-group">
                <label>🏁 Куди їдемо (призначення):</label>
                <input type="text" id="to_address" placeholder="Введіть пункт призначення">
            </div>
        </div>

        <div class="btn-group">
            <button id="cancelBtn" onclick="window.Telegram.WebApp.close()">Скасувати</button>
            <button id="submitBtn">Замовити таксі</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ініціалізація Leaflet карти (центр у Кобеляках)
        const map = L.map('map', {zoomControl: false}).setView([49.1445, 34.1906], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let currentLat = 49.1445;
        let currentLng = 34.1906;

        // Зберігаємо координати центру карти під час пересування
        map.on('move', () => {
            const center = map.getCenter();
            currentLat = center.lat;
            currentLng = center.lng;
        });

        function setPreset(name, lat, lng) {
            map.setView([lat, lng], 16);
            document.getElementById('from_address').value = name;
            currentLat = lat;
            currentLng = lng;
        }

        document.getElementById("submitBtn").addEventListener("click", () => {
            const from = document.getElementById("from_address").value.trim() || "Точка на мапі";
            const to = document.getElementById("to_address").value.trim();

            if (!to) {
                alert("Будь ласка, введіть пункт призначення!");
                return;
            }

            const data = { 
                action: "new_order",
                address_from: from, 
                address_to: to,
                lat: currentLat,
                lng: currentLng
            };
            
            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
