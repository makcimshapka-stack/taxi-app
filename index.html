<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Замовлення таксі Кобеляки</title>
    <!-- Підключаємо Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS для карти -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: 38vh;
            flex-shrink: 0;
        }
        .form-container {
            flex-grow: 1;
            background: var(--tg-theme-bg-color, #fff);
            padding: 10px 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #666);
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: var(--tg-theme-secondary-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .row {
            display: flex;
            gap: 8px;
        }
        .row input {
            flex-grow: 1;
        }
        button.action-btn {
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .gps-btn {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
            margin-bottom: 5px;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        .submit-btn:active {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="form-container">
        <div class="input-group">
            <label>📞 Ваш номер телефону</label>
            <input type="tel" id="phone" placeholder="+380XXXXXXXXX" value="380">
        </div>

        <div class="input-group">
            <label>📍 Звідки забирати?</label>
            <div class="row">
                <input type="text" id="address_from" placeholder="Вулиця, номер будинку">
                <button class="action-btn" onclick="setMarkerFrom()">Ар. Звідки</button>
            </div>
        </div>

        <div class="input-group">
            <label>🏁 Куди їдемо?</label>
            <div class="row">
                <input type="text" id="address_to" placeholder="Вулиця призначення">
                <button class="action-btn" onclick="setMarkerTo()">Ар. Куди</button>
            </div>
        </div>

        <button class="gps-btn" onclick="locateUser()">📍 Визначити моє положення (GPS)</button>

        <div class="input-group">
            <label>💳 Оплата</label>
            <select id="payment_method">
                <option value="Готів
