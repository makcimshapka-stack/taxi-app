<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Замовлення Таксі - Кобеляки</title>
    
    <!-- Підключаємо Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Підключаємо Leaflet CSS та JS для карти -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #f5f5f5; overflow: hidden; }
        #map { width: 100%; height: 55vh; }
        .panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 45vh; background: #fff; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #777; }
        .input-group input { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #2481cc; }
        .order-btn { width: 100%; padding: 14px; background-color: #2ea44f; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Блок карти -->
    <div id="map"></div>

    <!-- Панель з полями вводу -->
    <div class="panel">
        <div>
            <div class="input-group">
                <label for="addressFrom">📍 Звідки забирати?</label>
                <input type="text" id="addressFrom" value="Центр (Кобеляки)" placeholder="Вулиця, орієнтир">
            </div>
            
            <div class="input-group">
                <label for="addressTo">🏁 Куди їдемо?</label>
                <input type="text" id="addressTo" placeholder="Введіть пункт призначення">
            </div>
        </div>

        <button class="order-btn" onclick="submitOrder()">Підтвердити замовлення</button>
    </div>

    <script>
        // Ініціалізація Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Центр міста Кобеляки
        const kobelyakyCoords = [49.1435, 34.2015];
        const map = L.map('map').setView(kobelyakyCoords, 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const marker = L.marker(kobelyakyCoords, {draggable: true}).addTo(map);

        // Функція надсилання замовлення
        function submitOrder() {
            const addressFrom = document.getElementById('addressFrom').value.trim();
            const addressTo = document.getElementById('addressTo').value.trim();

            if (!addressTo) {
                alert("Будь ласка, вкажіть пункт призначення (Куди)!");
                return;
            }

            // Формуємо дані для відправки в бот
            const orderData = {
                address_from: addressFrom || "Центр (Кобеляки)",
                address_to: addressTo
            };

            if (window.Telegram && window.Telegram.WebApp) {
                // Передаємо рядок JSON назад у бота
                tg.sendData(JSON.stringify(orderData));
            } else {
                alert("Помилка: відкривайте цей додаток через Telegram!");
            }
        }
    </script>
</body>
</html>
