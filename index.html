<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення Таксі - Кобеляки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA-DUMMY_KEY_FOR_TESTING&libraries=places"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 60vh; width: 100%; }
        .panel { padding: 15px; background: #fff; height: 40vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: #2ea44f; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="panel">
        <div>
            <input type="text" id="from_address" placeholder="Звідки (адреса або точка на мапі)">
            <input type="text" id="to_address" placeholder="Куди їдемо?">
        </div>
        <button id="submitBtn">Замовити таксі</button>
    </div>

    <script>
        let map, marker;
        const kobelyaky = { lat: 49.14452, lng: 34.19065 };

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: kobelyaky,
                zoom: 15,
            });

            marker = new google.maps.Marker({
                position: kobelyaky,
                map: map,
                draggable: true
            });

            // Оновлюємо адресу при перетягуванні маркера
            marker.addListener('dragend', function(event) {
                document.getElementById("from_address").value = `Координати: ${event.latLng.lat().toFixed(5)}, ${event.latLng.lng().toFixed(5)}`;
            });
        }

        window.onload = initMap;

        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById("submitBtn").addEventListener("click", () => {
            const from = document.getElementById("from_address").value || "Центр (Кобеляки)";
            const to = document.getElementById("to_address").value || "В межах міста";

            const data = { address_from: from, address_to: to };
            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
