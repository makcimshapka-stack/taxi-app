<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення Таксі - Кобеляки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDW4v2j7tbpzvEmnzuEmf9lk-z2Lk1ak7s&libraries=places"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #f4f4f4; }
        #map { height: 48vh; width: 100%; }
        .panel { padding: 12px; background: #fff; height: 52vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; border-top-left-radius: 16px; border-top-right-radius: 16px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 6px; }
        label { font-size: 12px; font-weight: bold; color: #444; display: block; margin-bottom: 2px; }
        input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; background: #fff; }
        input.active-field { border-color: #0366d6; background: #f0f7ff; }
        .btn-group { display: flex; gap: 8px; margin-top: 4px; }
        button { border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        #submitBtn { background: #2ea44f; color: white; }
        #cancelBtn { background: #d73a49; color: white; }
        .hint { font-size: 12px; color: #0366d6; text-align: center; margin-bottom: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="panel">
        <div>
            <div class="hint" id="instruction">📍 Визначення вашого місця розташування...</div>
            
            <div class="input-group" onclick="setActiveField('from')">
                <label>📍 Звідки їдемо:</label>
                <input type="text" id="from_address" class="active-field" readonly placeholder="Визначаємо геолокацію...">
            </div>
            
            <div class="input-group" onclick="setActiveField('to')">
                <label>🏁 Куди їдемо:</label>
                <input type="text" id="to_address" readonly placeholder="Натисніть сюди, потім оберіть точку на мапі">
            </div>
        </div>

        <div class="btn-group">
            <button id="cancelBtn" onclick="cancelOrder()">Скасувати</button>
            <button id="submitBtn">Замовити таксі</button>
        </div>
    </div>

    <script>
        let map, geocoder;
        let activeField = 'from';
        let markerFrom = null;
        let markerTo = null;
        
        const defaultLocation = { lat: 49.14452, lng: 34.19065 }; // Кобеляки за замовчуванням

        function initMap() {
            geocoder = new google.maps.Geocoder();
            map = new google.maps.Map(getElementByIdSafe("map"), {
                center: defaultLocation,
                zoom: 15,
                disableDefaultUI: false,
                clickableIcons: false
            });

            map.addListener('click', (event) => {
                setPoint(event.latLng, activeField);
            });

            // Автогеолокація пристрою користувача
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLatLng = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        map.setCenter(userLatLng);
                        setPoint(userLatLng, 'from');
                    },
                    () => {
                        // Якщо доступ заборонено — ставимо центр Кобеляк
                        setPoint(defaultLocation, 'from');
                    }
                );
            } else {
                setPoint(defaultLocation, 'from');
            }
        }

        function getElementIdSafe(id) { return document.getElementById(id); }

        function setActiveField(field) {
            activeField = field;
            getElementIdSafe('from_address').classList.remove('active-field');
            getElementIdSafe('to_address').classList.remove('active-field');
            
            const hint = getElementIdSafe('instruction');
            if (field === 'from') {
                getElementIdSafe('from_address').classList.add('active-field');
                hint.innerText = "👇 Вибрано «Звідки». Клікніть на мапу для зміни.";
            } else {
                getElementIdSafe('to_address').classList.add('active-field');
                hint.innerText = "👇 Вибрано «Куди». Клікніть на мапу для вибору призначення.";
            }
        }

        function setPoint(latLng, fieldId) {
            geocoder.geocode({ location: latLng, language: 'uk' }, (results, status) => {
                let addressText = "";
                
                if (status === "OK" && results[0]) {
                    // Шукаємо найбільш точну назву вулиці/будинку
                    let place = results[0];
                    addressText = place.formatted_address;
                } else {
                    addressText = `Кобеляки (Координати: ${latLng.lat.toFixed(4)}, ${latLng.lng.toFixed(4)})`;
                }

                // Очищуємо зайве з адреси
                addressText = addressText.replace(", Україна", "").replace("Україна", "").trim();

                if (fieldId === 'from') {
                    if (markerFrom) markerFrom.setMap(null);
                    markerFrom = new google.maps.Marker({
                        position: latLng,
                        map: map,
                        title: "Звідки",
                        icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
                    });
                    getElementIdSafe("from_address").value = addressText;
                } else {
                    if (markerTo) markerTo.setMap(null);
                    markerTo = new google.maps.Marker({
                        position: latLng,
                        map: map,
                        title: "Куди",
                        icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
                    });
                    getElementIdSafe("to_address").value = addressText;
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof google === 'object' && typeof google.maps === 'object') {
                initMap();
            }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        getElementIdSafe("submitBtn").addEventListener("click", () => {
            const from = getElementIdSafe("from_address").value || "Центр (Кобеляки)";
            const to = getElementIdSafe("to_address").value || "В межах міста";

            const data = { 
                action: "new_order",
                address_from: from, 
                address_to: to 
            };
            
            tg.sendData(JSON.stringify(data));
            tg.close();
        });

        function cancelOrder() {
            if (markerFrom) markerFrom.setMap(null);
            if (markerTo) markerTo.setMap(null);
            getElementIdSafe("from_address").value = "";
            getElementIdSafe("to_address").value = "";
            setActiveField('from');
            tg.close();
        }
    </script>
</body>
</html>
