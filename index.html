<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таксі Кобеляки - Visicom</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; display: flex; flex-direction: column; background: #f8f9fa; }
    #map { flex: 1; width: 100%; }
    .controls { padding: 16px; background: #fff; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); border-radius: 16px 16px 0 0; z-index: 1000; }
    .input-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #28a745; }
    button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
    button:active { background: #218838; }
    .hint { font-size: 11px; color: #888; text-align: center; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="controls">
    <div class="hint">Клікніть на мапу для вибору точок або введіть адреси вручну</div>
    <div class="input-group">
      <label for="from">Звідки:</label>
      <input type="text" id="from" placeholder="Введіть адресу або клікніть на мапу">
    </div>
    <div class="input-group">
      <label for="to">Куди:</label>
      <input type="text" id="to" placeholder="Введіть адресу або клікніть на мапу">
    </div>
    <button id="send-btn" onclick="submitOrder()">Підтвердити замовлення</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Ініціалізація карти з центром у Кобеляках (Visicom)
    const map = L.map('map').setView([49.14452, 34.19065], 14);

    // Підключення шару тайлів Visicom Raster API
    L.tileLayer('https://tms.visicom.ua/3.0/planet/uk/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://visicom.ua/">Visicom</a>',
      maxZoom: 19
    }).addTo(map);

    let fromMarker = null;
    let toMarker = null;

    // Вибір точок кліком по мапі
    map.on('click', function(e) {
      const coords = e.latlng.lat.toFixed(4) + ', ' + e.latlng.lng.toFixed(4);

      if (!fromMarker) {
        fromMarker = L.marker(e.latlng).addTo(map).bindPopup("Звідки").openPopup();
        document.getElementById('from').value = "Координати: " + coords;
      } else if (!toMarker) {
        toMarker = L.marker(e.latlng).addTo(map).bindPopup("Куди").openPopup();
        document.getElementById('to').value = "Координати: " + coords;
      } else {
        map.removeLayer(fromMarker);
        map.removeLayer(toMarker);
        toMarker = null;
        fromMarker = L.marker(e.latlng).addTo(map).bindPopup("Звідки").openPopup();
        document.getElementById('from').value = "Координати: " + coords;
        document.getElementById('to').value = '';
      }
    });

    function submitOrder() {
      const fromVal = document.getElementById('from').value.trim();
      const toVal = document.getElementById('to').value.trim();

      if (!fromVal || !toVal) {
        alert("Будь ласка, введіть або оберіть обидві точки!");
        return;
      }

      const payload = JSON.stringify({
        address_from: fromVal,
        address_to: toVal
      });

      if (tg && tg.sendData) {
        try {
          tg.sendData(payload);
          tg.close();
          return;
        } catch (e) {
          console.log("sendData failed", e);
        }
      }

      alert("Дані сформовано:\nЗвідки: " + fromVal + "\nКуди: " + toVal);
      if (tg) tg.close();
    }
  </script>
</body>
</html>
