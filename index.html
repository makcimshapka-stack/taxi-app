<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Замовлення Таксі - Кобеляки</title>
    
    <!-- Підключаємо Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Підключаємо стилі та скрипти карти Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
        }
        #map {
            width: 100%;
            height: 55vh;
            position: relative;
        }
        .panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45vh;
            background: var(--tg-theme-bg-color, #ffffff);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--tg-theme-hint-color, #777);
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            background: var(--tg-theme-secondary-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            outline: none;
        }
        .input-group input:focus {
            border-color: #2481cc;
        }
        .order-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }
        .order-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Блок карти -->
    <div id="map"></div>

    <!-- Панель керування замовленням -->
    <div class="panel">
        <div>
            <div class="input-group">
                <label for="addressFrom">📍 Звідки забирати?</label>
                <input type="text" id="addressFrom" placeholder="Вулиця, номер будинку або орієнтир">
            </div>
            
            <div class="input-group">
                <label for="addressTo">🏁 Куди їдемо?</label>
                <input type="text" id="addressTo" placeholder="Пункт призначення">
            </div>
        </div>

        <button class="order-btn" onclick="submitOrder()">Замовити таксі</button>
    </div>

    <script>
        // Ініціалізація Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо на весь екран

        // Центр міста Кобеляки (Полтавська область)
        const kobelyakyCoords = [49.1435, 34.2015];

        // Створюємо карту
        const map = L.map('map').setView(kobelyakyCoords, 14);

        // Додаємо шар карти OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Маркер по центру карти (для вибору точки)
        const marker = L.marker(kobelyakyCoords, {draggable: true}).addTo(map);

        // При переміщенні карти оновлюємо поле "Звідки" (можна додати геокодер, або залишити як приклад)
        marker.on('dragend', function(event) {
            let position = marker.getLatLng();
            document.getElementById('addressFrom').value = `Координати: ${position.lat.toFixed(4)}, ${position.lng.toFixed(4)}`;
        });

        // Функція надсилання замовлення у бот
        function submitOrder() {
            const addressFrom = document.getElementById('addressFrom').value.trim();
            const addressTo = document.getElementById('addressTo').value.trim();

            if (!addressFrom) {
                alert("Будь ласка, вкажіть адресу відправлення!");
                return;
            }

            if (!addressTo) {
                alert("Будь ласка, вкажіть пункт призначення!");
                return;
            }

            // Формуємо об'єкт із даними замовлення
            const orderData = {
                action: "new_order",
                address_from: addressFrom,
                address_to: addressTo
            };

            if (window.Telegram && window.Telegram.WebApp) {
                // Передаємо дані назад у бот
                tg.sendData(JSON.stringify(orderData));
                // Закриваємо міні-додаток
                tg.close();
            } else {
                alert("Помилка: відкрийте цей додаток через Telegram-бота!");
            }
        }
    </script>
</body>
</html>
