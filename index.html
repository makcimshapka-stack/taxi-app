<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення Таксі - Кобеляки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCQgPWg1y8w7Ec3rP37jpVo6vFXg6pFUJ0&libraries=places"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #f4f4f4; }
        #map { height: 50vh; width: 100%; }
        .panel { padding: 12px; background: #fff; height: 50vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; border-top-left-radius: 16px; border-top-right-radius: 16px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 4px; }
        label { font-size: 12px; font-weight: bold; color: #666; margin-left: 4px; }
        input { width: 100%; padding: 10px; margin-top: 2px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
        input.active-field { border-color: #0366d6; background: #f0f7ff; }
        .btn-group { display: flex; gap: 8px; margin-top: 5px; }
        button { border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        #submitBtn { background: #2ea44f; color: white; }
        #cancelBtn { background: #d73a49; color: white; }
        .hint { font-size: 11px; color: #d73a49; text-align: center; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="panel">
        <div>
            <div class="hint">👇 Оберіть поле нижче і клікніть на мапу для вибору точки</div>
            
            <div class="input-group">
                <label>Звідки їдемо:</label>
                <input type="text" id="from_address" class="active-field" placeholder="Натисніть сюди, потім на мапу" onclick="setActiveField('from')">
            </div>
            
            <div class="input-group">
                <label>Куди їдемо:</label>
                <input type="text" id="to_address" placeholder="Натисніть сюди, потім на мапу" onclick="setActiveField('to')">
            </div>
        </div>

        <div class="btn-group">
            <button id="cancelBtn" onclick="cancelOrder()">Скасувати</button>
            <button id="submitBtn">Замовити таксі</button>
        </div>
    </div>

    <script>
        let map, marker, geocoder;
        let activeField = 'from'; // 'from' або 'to'
        const kobelyaky = { lat: 49.14452, lng: 34.19065 };

        function initMap() {
            geocoder = new google.maps.Geocoder();
            map = new google.maps.Map(document.getElementById("map"), {
                center: kobelyaky,
                zoom: 15,
                disableDefaultUI: false,
                clickableIcons: false
            });

            marker = new google.maps.Marker({
                position: kobelyaky,
                map: map,
                draggable: true,
                animation: google.maps.Animation.DROP
            });

            // Клік по мапі ставитиме маркер і заповнюватиме активне поле
            map.addListener('click', (event) => {
                marker.setPosition(event.latLng);
                getAddress(event.latLng, activeField);
            });

            // Перетягування маркера оновлює активне поле
            marker.addListener('dragend', (event) => {
                getAddress(event.latLng, activeField);
            });

            // Початкове заповнення адреси центру Кобеляк
            getAddress(kobelyaky, 'from');
        }

        function setActiveField(field) {
            activeField = field;
            document.getElementById('from_address').classList.remove('active-field');
            document.getElementById('to_address').classList.remove('active-field');
            
            if (field === 'from') {
                document.getElementById('from_address').classList.add('active-field');
            } else {
                document.getElementById('to_address').classList.add('active-field');
            }
        }

        function getAddress(latLng, fieldId) {
            geocoder.geocode({ location: latLng, language: 'uk' }, (results, status) => {
                let addressText = "Центр, Кобеляки";
                if (status === "OK" && results[0]) {
                    // Шукаємо найбільш читабельну адресу (вулицю та номер будинку)
                    for (let i = 0; i < results.length; i++) {
                        if (results[i].types.includes('street_address') || results[i].types.includes('route') || results[i].types.includes('premise') || results[i].types.includes('sublocality')) {
                            addressText = results[i].formatted_address;
                            break;
                        }
                    }
                    // Якщо специфічного типу не знайшлось, беремо першу повну адресу
                    if (!addressText && results[0].formatted_address) {
                        addressText = results[0].formatted_address;
                    }
                }
                // Очищаємо від зайвих регіональних приписок, якщо є
                addressText = addressText.replace(", Україна", "");
                
                if (fieldId === 'from') {
                    document.getElementById("from_address").value = addressText;
                } else {
                    document.getElementById("to_address").value = addressText;
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof google === 'object' && typeof google.maps === 'object') {
                initMap();
            }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById("submitBtn").addEventListener("click", () => {
            const from = document.getElementById("from_address").value || "Кобеляки (Центр)";
            const to = document.getElementById("to_address").value || "В межах міста";

            const data = { address_from: from, address_to: to };
            tg.sendData(JSON.stringify(data));
            tg.close();
        });

        function cancelOrder() {
            document.getElementById("from_address").value = "";
            document.getElementById("to_address").value = "";
            tg.close();
        }
    </script>
</body>
</html>
