<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виклик таксі</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; background: #f4f4f4; overflow: hidden; }
        #map-container { width: 100%; height: 40vh; position: relative; }
        #map { width: 100%; height: 100%; }
        .map-pin { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); font-size: 38px; pointer-events: none; z-index: 1000; }
        .panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 60vh; background: #fff; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); overflow-y: auto; }
        .input-group { margin-bottom: 10px; }
        label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 14px; outline: none; background: #fff; }
        input:focus { border-color: #007aff; background: #f0f7ff; }
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        button { border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        #submitBtn { background: #2ea44f; color: white; }
        #cancelBtn { background: #d73a49; color: white; }
        .hint { font-size: 12px; color: #007aff; text-align: center; margin-bottom: 8px; font-weight: bold; background: #eef5ff; padding: 6px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="map-container">
        <div class="map-pin">📍</div>
        <div id="map"></div>
    </div>

    <div class="panel">
        <div>
            <div class="hint">📍 Введіть адреси або рухайте мапу</div>

            <div class="input-group">
                <label>📍 Звідки забирати:</label>
                <input type="text" id="from_address" placeholder="Введіть вулицю" value="Центр (Кобеляки)">
            </div>
            
            <div class="input-group">
                <label>🏁 Куди їдемо (призначення):</label>
                <input type="text" id="to_address" placeholder="Введіть пункт призначення">
            </div>
        </div>

        <div class="btn-group">
            <button id="cancelBtn" onclick="try { window.Telegram.WebApp.close(); } catch(e) { window.close(); }">Скасувати</button>
            <button id="submitBtn" onclick="makeOrder()">Замовити таксі</button>
        </div>
    </div>

    <script>
        // Безпечна ініціалізація Telegram WebApp
        let tg = window.Telegram.WebApp;
        try {
            tg.expand();
        } catch (e) {
            console.log("WebApp не ініціалізовано");
        }

        // Ініціалізація карти Leaflet
        const map = L.map('map', {zoomControl: false}).setView([49.1445, 34.1906], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let isEditingFrom = false;
        const fromInput = document.getElementById('from_address');
        const toInput = document.getElementById('to_address');

        fromInput.addEventListener('focus', () => { isEditingFrom = true; });

        map.on('moveend', () => {
            const center = map.getCenter();
            if (!isEditingFrom) {
                fromInput.value = `GPS: ${center.lat.toFixed(4)}, ${center.lng.toFixed(4)}`;
            }
        });

        // Головна функція замовлення, яка викликається прямо з HTML-кнопки
        function makeOrder() {
            const fromVal = fromInput.value.trim();
            const toVal = toInput.value.trim();

            if (!toVal) {
                alert("Будь ласка, введіть пункт призначення (Куди)!");
                toInput.focus();
                return;
            }

            const data = { 
                action: "new_order",
                address_from: fromVal || "Центр", 
                address_to: toVal
            };

            try {
                // Відправляємо дані боту
                tg.sendData(JSON.stringify(data));
            } catch (err) {
                alert("Помилка відправки даних: " + err.message);
            }
        }
    </script>
</body>
</html>
